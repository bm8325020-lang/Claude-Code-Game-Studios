# roda sem root: tudo em /tmp. ${PORT} é trocado pelo start.sh
pid /tmp/nginx.pid;
error_log /dev/stderr warn;
events {}
http {
	access_log off;
	client_body_temp_path /tmp/nb; proxy_temp_path /tmp/np; fastcgi_temp_path /tmp/nf;
	uwsgi_temp_path /tmp/nu; scgi_temp_path /tmp/ns;
	server {
		listen ${PORT};
		location / { root /tmp/www; try_files $uri /index.html; default_type text/html; }
		location /jogo {
			proxy_pass http://127.0.0.1:7861;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_read_timeout 3600s;
			proxy_send_timeout 3600s;
		}
		location /salas {
			proxy_pass http://127.0.0.1:7862;
			proxy_http_version 1.1;
			proxy_set_header Upgrade $http_upgrade;
			proxy_set_header Connection "upgrade";
			proxy_read_timeout 3600s;
			proxy_send_timeout 3600s;
		}
	}
}
